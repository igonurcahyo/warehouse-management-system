services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warehouse_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - mysql
    networks:
      - warehouse_network

  nginx:
    image: nginx:alpine
    container_name: warehouse_nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - warehouse_network

  mysql:
    image: mysql:8.0
    container_name: warehouse_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: warehouse_management
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: laravel
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - warehouse_network

networks:
  warehouse_network:

volumes:
  mysql_data: